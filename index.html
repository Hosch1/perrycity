<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perrycity</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
</head>

<body>

    <div id="login-screen">

        <div class="logo">
            <div class="logo-city">🏙️</div>
            <h1>Perrycity</h1>
        </div>

        <p class="subtitle">
            Deine Stadt. Dein Unternehmen. Deine Welt.
        </p>

        <input
            id="player-name"
            type="text"
            placeholder="Spielername"
            maxlength="20"
        >

        <input
            id="password"
            type="password"
            placeholder="Passwort"
        >

        <div class="login-buttons">

            <button onclick="register()">
                Registrieren
            </button>

            <button onclick="login()">
                Einloggen
            </button>

        </div>

        <p id="message"></p>

    </div>


    <div id="game-screen">

        <div id="topbar">

            <div class="brand">
                🏙️ <strong>Perrycity</strong>
            </div>

            <div>
                Spieler:
                <strong id="display-name">-</strong>
            </div>

            <div class="money-box">
                💰
                <strong id="money">0</strong> €
            </div>

            <button
                class="logout-button"
                onclick="logout()"
            >
                Abmelden
            </button>

        </div>

        <div id="game"></div>

    </div>


    <script src="game.js"></script>

</body>
</html>
